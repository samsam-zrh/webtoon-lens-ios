name: Webtoon Lens V2 CI
run-name: Webtoon Lens V2 CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
      - main
      - samsam-zrh-webtoon-lens-v2
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read
  actions: read

jobs:
  simulator-tests:
    name: Generate project and run simulator tests
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Core and bridge contract regressions on macOS
        run: swift test

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: bash ci/test.sh

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WebtoonLensV2.xcresult
          path: build/TestResults/WebtoonLensV2.xcresult
          if-no-files-found: ignore
