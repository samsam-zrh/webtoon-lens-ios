name: WebtoonLensV2Personal
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WEBTOON_LENS_PERSONAL
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WEBTOON_LENS_PERSONAL DEBUG
targets:
  WebtoonLensCore:
    type: framework
    platform: iOS
    sources:
      - Core/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.webtoonlens.v2.core
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  WebtoonLensV2:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - AppIntents/Sources
      - path: App/Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - WebtoonLens.entitlements
      - path: PhonePreview/layout.js
        buildPhase: resources
    dependencies:
      - target: WebtoonLensCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.webtoonlens.v2
        INFOPLIST_FILE: App/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
  WebtoonLensCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/WebtoonLensCoreTests
    dependencies:
      - target: WebtoonLensCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.webtoonlens.v2.coretests
        GENERATE_INFOPLIST_FILE: YES
  WebtoonLensUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/WebtoonLensUITests
    dependencies:
      - target: WebtoonLensV2
      - target: WebtoonLensCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.webtoonlens.v2.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WebtoonLensV2
schemes:
  WebtoonLensV2:
    build:
      targets:
        WebtoonLensV2: all
        WebtoonLensCoreTests: [test]
        WebtoonLensUITests: [test]
    test:
      targets:
        - WebtoonLensCoreTests
        - WebtoonLensUITests
  WebtoonLensV2LocalBackend:
    build:
      targets:
        WebtoonLensV2: all
        WebtoonLensUITests: [test]
    test:
      targets:
        - WebtoonLensUITests
      environmentVariables:
        WEBTOON_LENS_TEST_BACKEND: http://127.0.0.1:8787
  WebtoonLensV2SiteChecks:
    build:
      targets:
        WebtoonLensV2: all
        WebtoonLensCoreTests: [test]
        WebtoonLensUITests: [test]
    test:
      targets:
        - WebtoonLensCoreTests
        - WebtoonLensUITests
      environmentVariables:
        WEBTOON_LENS_TEST_BACKEND: http://127.0.0.1:8787
        WEBTOON_LENS_TEST_SITES: "1"
        WEBTOON_LENS_TEST_READING_VIEWPORT: "1"
  WebtoonLensV2PublicChapter:
    build:
      targets:
        WebtoonLensV2: all
        WebtoonLensCoreTests: [test]
        WebtoonLensUITests: [test]
    test:
      targets:
        - WebtoonLensCoreTests
        - WebtoonLensUITests
      environmentVariables:
        WEBTOON_LENS_TEST_PUBLIC_CHAPTER: "1"
        WEBTOON_LENS_TEST_BACKEND: http://127.0.0.1:8787
  WebtoonLensV2FocusedReader:
    build:
      targets:
        WebtoonLensV2: all
        WebtoonLensCoreTests: [test]
        WebtoonLensUITests: [test]
    test:
      targets:
        - WebtoonLensCoreTests
        - WebtoonLensUITests
      environmentVariables:
        WEBTOON_LENS_TEST_BACKEND: http://127.0.0.1:8787
        WEBTOON_LENS_TEST_PUBLIC_CHAPTER: "1"
        WEBTOON_LENS_TEST_WEBNOVEL: "1"
