name: WebtoonLensV2Personal
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WEBTOON_LENS_PERSONAL
targets:
  WebtoonLensCore:
    type: framework
    platform: iOS
    sources:
      - Core/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.webtoonlens.v2.core
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  WebtoonLensV2:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - AppIntents/Sources
    resources:
      - App/Resources
    dependencies:
      - target: WebtoonLensCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.webtoonlens.v2
        INFOPLIST_FILE: App/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
  WebtoonLensCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/WebtoonLensCoreTests
    dependencies:
      - target: WebtoonLensCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.webtoonlens.v2.coretests
  WebtoonLensUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/WebtoonLensUITests
    dependencies:
      - target: WebtoonLensV2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.webtoonlens.v2.uitests
        TEST_TARGET_NAME: WebtoonLensV2
schemes:
  WebtoonLensV2:
    build:
      targets:
        WebtoonLensV2: all
        WebtoonLensCoreTests: [test]
        WebtoonLensUITests: [test]
    test:
      targets:
        - WebtoonLensCoreTests
        - WebtoonLensUITests
